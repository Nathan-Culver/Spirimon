<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1e3730"><title>Mystery Spirimon — walking animations</title>
<style>*{box-sizing:border-box}body{margin:0;background:#19342c;color:#fff8df;font:16px/1.5 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:32px 20px}h1{font-size:28px;margin:0}p{color:#bfd3c2}figure{margin:0;background:linear-gradient(#c1f49a,#83c45a);border:2px solid #b7c592;border-radius:12px;padding:18px;text-align:center;color:#293d2a}figure img{display:block;max-width:100%;width:384px;margin:auto}.walks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:24px 0}canvas{display:block;max-width:100%;width:160px;height:auto;margin:auto;image-rendering:pixelated}button,a{font:inherit;color:inherit}button{padding:8px 16px;border:1px solid #b7c592;border-radius:6px;background:#365947;cursor:pointer}a{display:inline-block;margin-left:16px}@media(max-width:650px){.walks{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main><h1>Mystery Spirimon</h1><p>The temporary form shown while Spirimon artwork loads.</p><figure><img src="./mystery.webp" alt="Translucent mystery creature with glowing eyes, a question mark, and swirling mist"></figure><section class="walks" aria-label="Walking directions"><figure><canvas width="160" height="160" data-row="0" aria-label="Walking up"></canvas><figcaption>Up</figcaption></figure><figure><canvas width="160" height="160" data-row="1" aria-label="Walking down"></canvas><figcaption>Down</figcaption></figure><figure><canvas width="160" height="160" data-row="2" aria-label="Walking left"></canvas><figcaption>Left</figcaption></figure><figure><canvas width="160" height="160" data-row="3" aria-label="Walking right"></canvas><figcaption>Right</figcaption></figure></section><button id="pause" type="button">Pause walking</button><a href="../../?release=mystery-10">Open Spirimon</a></main>
<script>const image=new Image(),canvases=[...document.querySelectorAll('canvas')],button=document.getElementById('pause');let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;function label(){button.textContent=paused?'Play walking':'Pause walking';}button.onclick=()=>{paused=!paused;label();};label();image.onload=()=>{function draw(time){const frame=paused?0:Math.floor(time/140)%4;for(const canvas of canvases){const c=canvas.getContext('2d');c.clearRect(0,0,160,160);c.imageSmoothingEnabled=false;c.drawImage(image,frame*image.width/4,Number(canvas.dataset.row)*image.height/4,image.width/4,image.height/4,0,0,160,160);}requestAnimationFrame(draw);}requestAnimationFrame(draw);};image.src='./mystery-walk.webp';</script></body></html>
