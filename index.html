<main id="main"><section id="startup-panel" class="panel" style="margin:24px;padding:24px" aria-labelledby="startup-title"><h1 id="startup-title">Loading Spirimon…</h1><p id="startup-status" role="status" aria-live="polite">Connecting to game code…</p><p id="startup-help">Pages build 8 · Your saved journey stays on this device.</p><button id="startup-retry" class="btn" onclick="window.spirimonRetry()" hidden>Retry loading</button></section></main>

<script>
(function(){
 const main=document.getElementById('main'),status=document.getElementById('startup-status'),help=document.getElementById('startup-help'),retry=document.getElementById('startup-retry');
 let ready=false,failed=false;
 window.spirimonRetry=()=>{const url=new URL(location.href);url.searchParams.set('reload',String(Date.now()));location.replace(url.href);};
 const error=(message)=>{if(ready||failed)return;failed=true;clearTimeout(slowTimer);main.innerHTML='<section class="panel" style="margin:24px;padding:24px"><h1>Spirimon could not start</h1><p>'+String(message).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))+'</p><p>Pages build 8 · Your saved journey has not been erased.</p><button class="btn" onclick="window.spirimonRetry()">Retry loading</button></section>';};
 const slowTimer=window.setTimeout(()=>{if(ready||failed||!main.querySelector('#startup-panel'))return;help.textContent='Pages build 8 · Loading is taking longer than usual. Stalled downloads retry automatically. You can also retry now.';retry.hidden=false;},12000);
 window.addEventListener('spirimon-startup',event=>{if(!ready&&!failed)status.textContent=String(event.detail||'Preparing your journey…');});
 window.addEventListener('spirimon-ready',()=>{ready=true;clearTimeout(slowTimer);});
 window.addEventListener('spirimon-startup-error',event=>error(event.detail||'The game could not open your saved journey.'));
 window.addEventListener('error',event=>{if(event.message)error(event.message);});
 window.addEventListener('unhandledrejection',event=>error(event.reason?.message||event.reason||'A game module failed.'));
 window.spirimonLoadGame=path=>{
  let attempt=0;
  function load(){
   if(ready||failed||window.__spirimonStarted)return;
   attempt++;status.textContent='Downloading game code ('+attempt+' / 3)…';
   const script=document.createElement('script'),url=new URL(path,document.baseURI);let settled=false;
   if(attempt>1)url.searchParams.set('retry',attempt+'-'+Date.now());
   function finish(ok){
    if(settled)return;settled=true;clearTimeout(timer);script.onload=null;script.onerror=null;
    if(ok){if(!window.__spirimonStarted)error('Game code did not initialize. Retry to download a fresh copy.');return;}
    script.remove();if(window.__spirimonStarted||failed||ready)return;
    if(attempt<3)load();else error('Game code could not download after three attempts. Check your connection, then retry.');
   }
   script.onload=()=>finish(true);script.onerror=()=>finish(false);
   const timer=window.setTimeout(()=>finish(false),25000);
   script.src=url.href;document.head.appendChild(script);
  }
  load();
 };
})();
</script>
<meta name="spirimon-modules" content="ai-providers.mjs,world-art.mjs,asset-loader.mjs,towns.mjs,terrain.mjs,roster.mjs,moves.mjs,engine.mjs,sprites.mjs,audio.mjs,transformation.mjs,offerings.mjs,world.mjs,adventure-systems.mjs,interior-assets.mjs,move-animations.mjs,app.mjs">
