<script>
(function(){
 const main=document.getElementById('main'),status=document.getElementById('startup-status'),help=document.getElementById('startup-help'),retry=document.getElementById('startup-retry');
 let ready=false,failed=false;
 const error=(message)=>{if(ready||failed)return;failed=true;clearTimeout(slowTimer);main.innerHTML='<section class="panel" style="margin:24px;padding:24px"><h1>Spirimon could not start</h1><p>'+String(message).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))+'</p><p>Your saved journey has not been erased.</p><button class="btn" onclick="location.reload()">Retry loading</button></section>';};
 const slowTimer=window.setTimeout(()=>{if(ready||failed||!main.querySelector('#startup-panel'))return;help.textContent='Loading is taking longer than usual. You can keep this page open or retry.';retry.hidden=false;},12000);
 window.addEventListener('spirimon-startup',event=>{if(!ready&&!failed)status.textContent=String(event.detail||'Preparing your journey…');});
 window.addEventListener('spirimon-ready',()=>{ready=true;clearTimeout(slowTimer);});
 window.addEventListener('spirimon-startup-error',event=>error(event.detail||'The game could not open your saved journey.'));
 window.addEventListener('error',event=>{if(event.message)error(event.message);});
 window.addEventListener('unhandledrejection',event=>error(event.reason?.message||event.reason||'A game module failed.'));
 // Import once. The browser resolves and caches this release's whole module graph.
 import('./app.mjs').catch(error);
})();
</script>
