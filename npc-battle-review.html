<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spirimon · NPC Battle Sprite Review</title><style>
*{box-sizing:border-box}body{margin:0;background:#12241f;color:#ede8d2;font:16px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:32px}h1{font:34px Georgia;margin:8px 0}p{color:#b6c7b1;line-height:1.5}.tag{color:#d6c28d;font-size:12px;letter-spacing:3px}.lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:28px}article{border:1px solid #47614c;border-radius:12px;background:#1c3229;padding:12px;min-width:0}h2{font:18px Georgia;margin:12px 0 4px}.npc-battle-portrait{background:radial-gradient(ellipse at 50% 75%,#82985b40,transparent 70%)}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}small{color:#a7b89f;font-size:11px;line-height:1.6;display:block}button{background:#d6c28d;color:#152820;border:0;border-radius:5px;padding:12px;font:inherit;margin-top:18px;cursor:pointer}.speech{border:1px solid #688059;border-radius:10px;padding:20px;margin-top:24px;display:grid;grid-template-columns:100px 1fr;gap:24px;align-items:center}.speech p{margin:10px 0}.speech canvas{width:100px}.speech h2{margin:0}.speech button{margin:10px 6px 0 0}a{color:#d6c28d}@media(max-width:700px){main{padding:16px}.lineup{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style><main><div class="tag">SPIRIMON / WARDROBE REVIEW 01</div><h1>Five Sealer challengers</h1><p>Generated by the game’s NPC mixer. Headwear, head, shirt and trousers are chosen independently.<br>The same NPC keeps the same appearance through opening dialogue, closing dialogue and rematches.</p><section class="lineup" id="lineup"></section><button id="export">Save five NPCs as PNG</button><section class="speech" id="dialogue"></section><p><a href="./index.html">Return to Spirimon</a></p></main><script type="module">
const npcImage=new Image();let npcImageReady=false;function readyImage(){return npcImageReady?npcImage:null;}npcImage.onload=()=>{npcImageReady=true;renderNPCBattleSprites();};npcImage.src='./assets/npc-battle/wardrobe-v1.webp';

const NPC_BATTLE_ATLAS='./assets/npc-battle/wardrobe-v1.webp';
const NPC_BATTLE_PARTS=['trousers','shirt','head','hat'];
const COUNTS={trousers:5,shirt:5,head:5,hat:5};
function hash(value){let n=2166136261;for(const ch of String(value))n=Math.imul(n^ch.charCodeAt(0),16777619);return n>>>0;}
// No encounter counters or current coordinates: the same person keeps their wardrobe.
function npcBattleAppearance(seed,identity={}){
 const key=String(identity.id||identity.name||'opposing-sealer');
 const appearance={version:1};
 for(const part of NPC_BATTLE_PARTS)appearance[part]=hash(seed+'|'+key+'|'+part)%COUNTS[part];
 // Explicit parts allow authored recurring characters and future wardrobe changes.
 for(const part of NPC_BATTLE_PARTS){const value=identity.battleAppearance?.[part];if(Number.isInteger(value)&&value>=0&&value<COUNTS[part])appearance[part]=value;}
 return appearance;
}
function npcBattleLayers(appearance){
 // Registered source bands used by tooling; renderer masks garment overlap.
 return [{part:'trousers',top:490,bottom:793},{part:'shirt',top:220,bottom:490},{part:'head',top:135,bottom:220},{part:'hat',top:0,bottom:135}].map(layer=>({...layer,variant:appearance[layer.part]??0}));
}
function drawNPCBattleSprite(ctx,image,appearance,{x=0,y=0,width=240,height=480}={}){
 const cellWidth=image.width/5;
 ctx.save();ctx.translate(x,y);ctx.scale(width/cellWidth,height/793);ctx.imageSmoothingEnabled=false;
 const stamp=(part,top,bottom)=>ctx.drawImage(image,(appearance[part]??0)*cellWidth,top,cellWidth,bottom-top,0,top,cellWidth,bottom-top);
 const polygon=points=>{ctx.moveTo(...points[0]);for(const point of points.slice(1))ctx.lineTo(...point);ctx.closePath();};
 // Lower garments retain their own waist wraps and talismans beneath the
 // shirt hem; drawing the original cloth preserves natural folds and legs.
 stamp('trousers',410,793);
 // Authored hem masks retain coat tails and hands without copying trousers.
 const hems=[[[110,405],[289,405],[303,475],[270,488],[225,441],[132,500],[106,480]],[[116,405],[283,405],[303,475],[265,486],[225,429],[172,480],[116,480]],[[117,405],[285,405],[302,485],[265,500],[224,440],[174,492],[110,473]],[[117,405],[287,405],[292,440],[113,440]],[[115,405],[286,405],[301,483],[265,500],[222,441],[169,492],[108,475]]];
 ctx.save();ctx.beginPath();ctx.rect(0,220,cellWidth,190);ctx.rect(0,410,112,92);ctx.rect(310,410,cellWidth-310,92);polygon(hems[appearance.shirt??0]);ctx.clip();stamp('shirt',220,530);ctx.restore();
 // Headwear includes its own hair and side trim. Only the face is swapped,
 // so a hood cannot leave behind a straw brim or a floating cap tassel.
 stamp('hat',0,220);
 ctx.save();ctx.beginPath();polygon([[169,151],[253,151],[273,171],[269,193],[242,215],[210,221],[175,205],[159,180]]);ctx.clip();stamp('head',135,220);ctx.restore();
 ctx.restore();
}
function renderNPCBattleSprites(root=document){
 const canvases=root.querySelectorAll('canvas[data-npc-battle]');if(!canvases.length)return;
 const image=readyImage(NPC_BATTLE_ATLAS);if(!image)return;
 for(const canvas of canvases){
  let appearance;try{appearance=JSON.parse(canvas.dataset.npcBattle);}catch{continue;}
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
  drawNPCBattleSprite(ctx,image,appearance,{width:canvas.width,height:canvas.height});
 }
}
function npcBattleSpriteHTML(seed,identity={},escape=String){
 const appearance=npcBattleAppearance(seed,identity),name=identity.name||'Opposing Sealer';
 return '<div class="npc-battle-portrait"><canvas width="240" height="480" data-npc-battle="'+escape(JSON.stringify(appearance))+'" role="img" aria-label="'+escape(name+' battle sprite')+'"></canvas></div>';
}
const NPC_REVIEW_IDENTITIES=[
 {id:'review-0',name:'NPC 1'},
 {id:'review-1',name:'NPC 2'},
 {id:'review-2',name:'NPC 3'},
 {id:'review-66',name:'NPC 4'},
 {id:'review-182',name:'NPC 5'}
];
const seed='wardrobe-review-01',names=['Teal','Burgundy','Indigo','Ochre','Plum'];
document.querySelector('#lineup').innerHTML=NPC_REVIEW_IDENTITIES.map((n,i)=>{const a=npcBattleAppearance(seed,n);return '<article>'+npcBattleSpriteHTML(seed,n,escapeHTML)+'<h2>NPC '+(i+1)+'</h2><small>Head '+(a.head+1)+' · Headwear '+(a.hat+1)+'<br>'+names[a.shirt]+' shirt · Trousers '+(a.trousers+1)+'</small></article>';}).join('');
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let closing=false;function dialogue(){document.querySelector('#dialogue').innerHTML=npcBattleSpriteHTML(seed,NPC_REVIEW_IDENTITIES[0],escapeHTML)+'<div><div class="tag">'+(closing?'THE BATTLE ENDS':'BEFORE THE CHALLENGE')+'</div><h2>NPC 1</h2><p>'+(closing?'Your bond is strong. I’ll remember what you taught me today.':'Let’s see how your Spirimon and mine work together.')+'</p><button id="phase">'+(closing?'Show opening dialogue':'Show closing dialogue')+'</button></div>';document.querySelector('#phase').onclick=()=>{closing=!closing;dialogue();};renderNPCBattleSprites();}
globalThis.spirimonArtLoaded=()=>renderNPCBattleSprites();dialogue();renderNPCBattleSprites();
</script></html>
<script>
document.querySelector('#export').onclick=()=>{
 const canvas=document.createElement('canvas');canvas.width=1500;canvas.height=900;const c=canvas.getContext('2d');c.fillStyle='#12241f';c.fillRect(0,0,1500,900);c.fillStyle='#d6c28d';c.font='18px sans-serif';c.fillText('SPIRIMON / NPC BATTLE SPRITE REVIEW',45,48);c.fillStyle='#ede8d2';c.font='36px Georgia';c.fillText('Five Sealer challengers',45,100);c.font='18px sans-serif';c.fillStyle='#b6c7b1';c.fillText('Independent headwear, faces, shirts and lower garments · Generated by the game’s NPC mixer',45,139);
 const cards=document.querySelectorAll('#lineup article');cards.forEach((card,i)=>{const x=35+i*290;c.fillStyle='#1c3229';c.fillRect(x,180,270,665);c.strokeStyle='#47614c';c.strokeRect(x,180,270,665);c.imageSmoothingEnabled=false;c.drawImage(card.querySelector('canvas'),x+8,195,254,508);c.fillStyle='#ede8d2';c.font='24px Georgia';c.fillText('NPC '+(i+1),x+18,754);c.fillStyle='#a7b89f';c.font='15px sans-serif';card.querySelector('small').innerText.split('\n').forEach((line,n)=>c.fillText(line,x+18,790+n*25));});
 canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Spirimon_Five_NPC_Battle_Sprites.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
};
</script>
