name: Build downloadable desktop and Android games
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/standalone.yml'
      - '**.mjs'
      - '**.js'
      - '**.css'
      - '**.html'
      - 'assets/**'
      - 'desktop/**'
      - 'native/**'
      - 'capacitor.config.json'
      - 'package*.json'
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test current game
        run: npm run build && npm test
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone game
        run: node build.mjs --target app --out-dir desktop/game
      - name: Package desktop application
        shell: bash
        run: |
          npx --yes @electron/packager@20.3.0 desktop Spirimon --electron-version=45.2.2 --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --out=dist --overwrite --prune=false
      - uses: actions/upload-artifact@v4
        with:
          name: Spirimon-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
  android:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Build offline web assets
        run: node build.mjs --target app --out-dir _site
      - name: Generate Android app
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          node tools/prepare-android.mjs
          npx cap sync android
      - name: Compile installable APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Spirimon-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
