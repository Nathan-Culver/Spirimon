name: Combat regression tests
on:
  push:
    paths:
      - 'engine.mjs'
      - 'moves.mjs'
      - 'tests/**'
      - '.github/workflows/combat-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check engine.mjs && node --check moves.mjs && node --test tests/*.test.mjs
