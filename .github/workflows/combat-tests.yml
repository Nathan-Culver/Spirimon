name: Combat regression tests
on:
  push:
    paths:
      - '**.mjs'
      - '**.js'
      - '**.css'
      - '**.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/combat-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: combat-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build.mjs
      - name: Check browser and server modules
        run: for file in *.mjs; do node --check "$file" || exit 1; done
      - run: npm test

