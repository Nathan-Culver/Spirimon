name: Pack recovered roster artwork
on:
  push:
    branches: ['art/complete-roster-20261104']
    paths: ['artwork/roster-source/**', 'tools/pack-recovered-roster-art.py', '.github/workflows/pack-roster-art.yml']
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy
      - run: python tools/pack-recovered-roster-art.py
      - run: node build.mjs && node --test tests/*.test.mjs
      - name: Save packed assets to the artwork branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/roster/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Pack recovered dedicated roster artwork"
            git push origin HEAD:art/complete-roster-20261104
          fi
